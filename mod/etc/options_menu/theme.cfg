# Options Menu / Theme Manager color palette. Each line is "Key=R,G,B"
# (0-255 each). Delete this file (or a line in it) to fall back to the
# built-in default for that color. Read once at startup - restart the app
# to see a change.

# overall app background, behind everything
Bg=12,15,22
# divider lines, box outlines, unselected tile border
Border=42,44,51
# selected row/tile border, section title accent bar, submenu chevrons, highlights
Accent=240,196,61
# selected row / grid tile fill - if you change Bg, change this too or the
# rounded tile corners will look like they kept the old background
SelectedRowBg=20,22,26

# main text - titles, row labels, badge hints
Text=255,255,255
# muted secondary text - dimmed labels, column headers
TextDim=141,141,147
# list scroll arrows - remove this line to follow Text
ScrollArrow=255,255,255
# the letter drawn inside a badge circle (A/B/X)
BadgeLetter=28,22,22

# A badge (Select) - outer ring, then a darker rim shade
BadgeA=76,175,110
BadgeADark=46,107,66
# B badge (Back/Exit)
BadgeB=225,85,84
BadgeBDark=140,52,51
# X badge (hold-to-delete hint)
BadgeX=108,142,191
BadgeXDark=63,89,127
# Y badge (unused right now, kept for future use)
BadgeY=201,123,132
BadgeYDark=143,71,80
# Start pill (wide badge instead of a letter circle)
BadgeStart=194,168,94
BadgeStartDark=116,101,56
