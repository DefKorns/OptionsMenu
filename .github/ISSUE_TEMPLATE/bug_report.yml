name: Bug report
description: Something in the Options Menu doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more of the fields below you fill in, the faster it can be fixed.
  - type: dropdown
    id: console
    attributes:
      label: Console
      options:
        - SNES Classic (USA)
        - SNES Classic (EUR)
        - Super Famicom Classic
        - NES Classic
        - Famicom Classic
        - Famicom Shonen Jump
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Options Menu version
      description: Shown next to the title at the top of the menu.
      placeholder: e.g. 2.1.0
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - options_menu
        - options_menu_compat
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Options Menu
        2. Go to ...
        3. ...
  - type: textarea
    id: mods
    attributes:
      label: Other mods installed
      description: In hakchi, **Modules → Generate modules report**, then paste it here or attach the file.
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: |
        With a USB/SD drive connected, **Advanced Options → Diagnostics** saves logs to `/media/data/log/`. Attach them, or a photo or screenshot of the problem, by dragging them here.
