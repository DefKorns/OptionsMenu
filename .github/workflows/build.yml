name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  hmod:
    # Keep in sync with the hmod-build submodule commit.
    uses: DefKorns/hmod-build/.github/workflows/hmod.yml@9f553b5718ca671cf7bf59f9c714c3e07042ee4d
    with:
      release-name: Options Menu
      docker: true
      # the compat build relinks with its own rpath and adds a private libstdc++
      make: |
        hmod
        hmod FIX_LIBSTDCXX=1
    secrets: inherit
    permissions:
      contents: write
