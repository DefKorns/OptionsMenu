name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  hmod:
    # Keep in sync with the hmod-build submodule commit.
    uses: DefKorns/hmod-build/.github/workflows/hmod.yml@918e15175aee0021ceb93d88debd75fc1caa140b
    with:
      release-name: Options Menu
      docker: true
      # the compat build relinks with its own rpath and adds a private libstdc++
      make: |
        hmod
        hmod FIX_LIBSTDCXX=1
    secrets: inherit
    permissions:
      contents: write
